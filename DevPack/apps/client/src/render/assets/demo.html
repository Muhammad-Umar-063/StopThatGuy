<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:," />
  <title>T008 — Development asset calibration</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #17252d; color: #f4f5ed; font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 1200px; margin: auto; padding: 24px; }
    h1 { margin: 0 0 6px; font-size: 28px; }
    p { margin: 6px 0 12px; }
    .badge { color: #ffca86; font-weight: 700; }
    .controls { display: flex; flex-wrap: wrap; gap: 12px; margin: 14px 0; }
    button { padding: 9px 16px; border: 1px solid #adbdc4; border-radius: 4px; background: #eef5f5; color: #17252d; font: inherit; cursor: pointer; }
    button:focus-visible { outline: 3px solid #ffad47; outline-offset: 3px; }
    #viewport { position: relative; height: 470px; }
    canvas { width: 100%; height: 100%; display: block; border: 1px solid #708590; }
    .axis-label { position: absolute; padding: 2px 6px; background: #17252de8; font-size: 14px; pointer-events: none; white-space: nowrap; }
    #status { min-height: 24px; font-weight: 600; }
    pre { margin: 12px 0 0; white-space: pre-wrap; font: 13px/1.5 ui-monospace, monospace; }
  </style>
</head>
<body><main>
  <div class="badge">STOP THAT GUY! · DEVELOPMENT FIXTURE</div>
  <h1>Asset scale & orientation</h1>
  <p>Original calibration sample only. This is not a final character, vehicle or visual-quality preview.</p>
  <p>Metres · Y up · yaw 0 faces +Z · positive yaw turns toward +X. Grid spacing: 0.25 m.</p>
  <div class="controls">
    <button id="reload">Load / retry sample</button><button id="yaw">Yaw +90°</button>
    <button id="camera">Top view</button><button id="dispose">Unload sample</button>
  </div>
  <div id="viewport"><canvas id="canvas" aria-label="Three-dimensional calibration model on a measured grid"></canvas></div>
  <p id="status" role="status" aria-live="polite">Loading calibration GLB…</p>
  <pre id="measurements"></pre>
</main><script type="module" src="./demo.ts"></script></body>
</html>
