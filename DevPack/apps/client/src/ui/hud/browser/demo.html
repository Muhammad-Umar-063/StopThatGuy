<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>Chase HUD · fixture preview</title><style>
body{margin:0;background:#e6edf0;color:#173a52;font:14px/1.4 "Trebuchet MS",Arial,sans-serif}*{box-sizing:border-box}.preview-tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:8px 16px;background:#fff;border-bottom:2px solid #185b83}.preview-tools h1{font-size:15px;margin:0 auto 0 0}.preview-tools select,.preview-tools input,.preview-tools button{font:inherit;color:inherit;background:#fff;border:1px solid #496479;border-radius:3px;min-height:36px;padding:5px 8px}.preview-tools button{cursor:pointer}.preview-tools button:hover{background:#f2c44b}.preview-tools label{font-size:12px}.preview-tools input{max-width:140px}.preview-tools :focus-visible,.hud-stage:focus-visible{outline:3px solid #173a52;outline-offset:-3px;box-shadow:inset 0 0 0 6px #f2c44b}.hud-stage{position:relative;min-height:calc(100svh - 115px);background:repeating-linear-gradient(110deg,#c7d0cc 0,#c7d0cc 150px,#aebbb7 150px,#aebbb7 153px);isolation:isolate}.hud-stage::before{content:"";position:absolute;inset:0 30%;background:#8d9c9a;border-inline:8px solid #dbe0cf;transform:skew(-12deg);z-index:-1}.layout-note{position:absolute;top:42%;left:50%;transform:translateX(-50%);font:700 13px/1.5 monospace;letter-spacing:.1em;text-align:center;color:#173a52;background:#f5f8fa;padding:12px;border:1px solid #496479;z-index:-1}.hud-host{min-height:inherit}.hud-host>.stg-hud{min-height:inherit}.preview-foot{padding:6px 16px;background:#fff;display:flex;gap:16px;justify-content:space-between;font-size:12px}.preview-foot p{margin:0}.hud-stage:focus-visible{outline-offset:-4px}@media(max-width:850px){.preview-tools{gap:4px 10px;padding:5px 8px}.preview-tools h1{font-size:12px}.preview-tools select,.preview-tools input,.preview-tools button{min-height:30px;font-size:12px}.preview-tools input{width:80px}.hud-stage{min-height:calc(100svh - 96px)}.preview-foot{font-size:10px}.layout-note{font-size:10px;padding:6px;top:40%}}
@media(max-width:700px) and (orientation:landscape){.preview-tools h1{max-width:90px;font-size:11px}.preview-tools{gap:4px 8px}.preview-tools input{width:65px}.layout-note{display:none}}
</style></head><body>
<header class="preview-tools"><h1>Stop That Guy! · HUD preview</h1><label>Scenario <select id="scenario"><option value="chase">Chase</option><option value="turn">Turn window</option><option value="countdown">Countdown</option><option value="intro">Intro</option><option value="expired">Expired timer</option><option value="unavailable">Cues unavailable</option><option value="wanted">Wanted / stunned</option><option value="arrested">Arrested</option><option value="results">Results</option><option value="disconnected">Disconnected</option></select></label><label>Preview note <input id="note" value="Lisbon" autocomplete="off"></label><button id="reduced" type="button" aria-pressed="false">Reduced motion</button></header>
<main id="play-surface" class="hud-stage" tabindex="0" aria-label="Fixture gameplay keyboard surface"><div class="layout-note" aria-hidden="true">LAYOUT CANVAS<br>No gameplay simulation</div><div id="hud" class="hud-host"></div></main>
<footer class="preview-foot"><p>Fixture data only · camera, city and live cue transport join in T020.</p><p id="intent-readout">Keyboard intents: 0</p></footer><script type="module" src="./demo.ts"></script></body></html>
